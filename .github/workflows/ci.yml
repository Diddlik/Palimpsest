name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    # Windows-only: the core links against Win32 hooks, ToUnicodeEx, and
    # SendInput, so there is nothing to gain from a Linux runner.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --examples -- -D warnings
      - run: cargo test --workspace
