[package]
name = "palimpsest-core"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Core hook, injection, and heuristics engine for Palimpsest."

[dependencies]
arc-swap.workspace = true
crossbeam-channel.workspace = true
fst.workspace = true
serde = { workspace = true }
tracing.workspace = true
# Diary at-rest encryption (crypt.rs): Argon2id password stretching +
# XChaCha20-Poly1305 AEAD. Pure Rust so the crypto round-trips in headless tests.
argon2 = "0.5"
chacha20poly1305 = "0.10"
base64 = "0.22"
getrandom = "0.2"

[build-dependencies]
fst.workspace = true

[target.'cfg(windows)'.dependencies]
windows.workspace = true
winreg = "0.52"

[dev-dependencies]
serde_json.workspace = true
tracing-subscriber.workspace = true
